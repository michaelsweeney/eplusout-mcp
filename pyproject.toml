[project]
name = "mcp-eplus-outputs"
version = "0.1.0"
description = "MCP server for accessing EnergyPlus building energy simulation results"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.10.4",
    "mcp[cli]>=1.10.1",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.1",
    "pytest>=8.0",
    "seaborn>=0.13.2",
]
