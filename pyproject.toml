[project]
name = "mcp-eplus-outputs"
version = "0.1.0"
description = "MCP server for accessing EnergyPlus building energy simulation results"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.10.4",
    "mcp[cli]>=1.10.1",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
